name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: vulkan
            model_dir: ~/.local/share/qwen-translate
          - os: macos-latest
            features: metal
            model_dir: ~/Library/Application Support/qwen-translate
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang spirv-headers libvulkan-dev glslang-tools glslc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --features ${{ matrix.features }}

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: ${{ matrix.model_dir }}
          key: model-qwen35-0.8b-q4_k_m-v2

      - name: Smoke test (stdin pipe)
        run: |
          out=$(echo "I love programming" | ./target/release/translate --model-source huggingface)
          echo "en->zh: $out"
          echo "$out" | grep -q "编程"

      - name: Smoke test (CLI args)
        run: |
          out=$(./target/release/translate "今天天气很好")
          echo "zh->en: $out"
          echo "$out" | grep -qi "weather"

      - name: Smoke test (image translation)
        run: |
          out=$(./target/release/translate --model-source huggingface --image tests/fixtures/hello-en.png)
          echo "image->zh: $out"
          echo "$out" | grep -q "编程"
